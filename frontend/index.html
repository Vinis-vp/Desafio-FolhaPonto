<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <title>Folha Ponto</title>
    <script src="/js/login.js" defer></script>
</head>
<body>
    <main class="container" style="max-width: 400px; margin-top: 10vh;">
        <h2>Login do Sistema</h2>
        <form onsubmit="autenticarUsuario(event)">
          <label for="matricula">
            Matrícula
            <input type="text" id="matricula" name="matricula" placeholder="Digite sua matrícula" required />
          </label>
          <label for="senha">
            Senha
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required />
          </label>
          <button type="submit" class="contrast">Entrar</button>
        </form>
      </main>
</body>
</html>
