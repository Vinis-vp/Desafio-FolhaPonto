<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ponto do Funcionário</title>
  <link rel="stylesheet" href="https://unpkg.com/@picocss/pico@1.*/css/pico.classless.min.css" />
  <style>
    :root {
      --text-dark: #000; /* Preto real */
      --gray-bg: #f5f5f5;
      --border-light: #ddd;
      --accent: #0275d8;
    }

    body {
      background: #fff;
      color: var(--text-dark);
      font-size: 14px;
    }

    main {
      max-width: 600px;
      margin: 4rem auto;
      padding: 1.5rem;
      background: #fff;
      border: 1px solid var(--border-light);
      border-radius: 6px;
    }

    h2 {
      font-size: 1.3rem;
      margin-bottom: 1.5rem;
      color: var(--accent);
    }

    .info {
      margin-bottom: 1.5rem;
    }

    .info p {
      margin: 0.3rem 0;
      font-weight: 500;
      color: var(--text-dark);
    }

    .info strong {
      color: var(--text-dark);
      font-weight: 600;
    }

    .horarios {
      background: var(--gray-bg);
      padding: 1rem;
      border: 1px solid var(--border-light);
      border-radius: 5px;
      margin-bottom: 1.5rem;
      color: var(--text-dark);
    }

    .horarios p,
    .horarios li,
    .horarios strong {
      color: var(--text-dark);
    }

    .horarios ul {
      padding-left: 1rem;
      margin: 0.5rem 0 0 0;
    }

    button {
      background-color: var(--accent);
      color: #fff;
      font-size: 13px;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    #horaAtual {
      font-weight: bold;
      color: var(--text-dark);
    }
  </style>
</head>
<body>
  <main>
    <h2>Registro de Ponto</h2>

    <div class="info">
      <p><strong>Funcionário:</strong> <span id="nomeFuncionario">Carregando...</span></p>
      <p><strong>Horário Atual:</strong> <span id="horaAtual">--:--:--</span></p>
    </div>

    <div class="horarios">
      <p><strong>Jornada de Trabalho:</strong></p>
      <ul>
        <li>Entrada Manhã: <span id="entradaManha">--:--</span></li>
        <li>Saída Manhã: <span id="saidaManha">--:--</span></li>
        <li>Entrada Tarde: <span id="entradaTarde">--:--</span></li>
        <li>Saída Tarde: <span id="saidaTarde">--:--</span></li>
      </ul>
    </div>

    <button onclick="registrarPonto()">Registrar Ponto</button>
  </main>
  <script src="../js/dadosFuncionario.js"></script>
</body>
</html>
